<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Visits - Admin</title>
<style>
  body { margin: 0; background: #0b0e14; color: #eef1f6; font-family: system-ui, sans-serif; padding: 20px; }
  .wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 1.4rem; }
  .card { background: #161b25; border: 1px solid #262b36; border-radius: 14px; padding: 16px; }
  .muted { color: #8a93a6; font-size: .9rem; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid #262b36; background: #0b0e14; color: #eef1f6; }
  button { font: inherit; font-weight: 700; padding: 10px 14px; border-radius: 10px; border: none; background: #7cf0c4; color: #0b2118; cursor: pointer; }
  button.ghost { background: transparent; color: #eef1f6; border: 1px solid #262b36; font-weight: 400; }
  .big { font-size: 2.2rem; margin: 4px 0; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 160px; margin-top: 10px; }
  .bar { flex: 1; background: #7cf0c4; border-radius: 6px 6px 0 0; min-height: 2px; }
  .labels { display: flex; gap: 6px; margin-top: 4px; }
  .labels span { flex: 1; text-align: center; font-size: .65rem; color: #8a93a6; }
  .err { color: #ff8a8a; min-height: 1.2em; margin: 6px 0 0; }
</style>
</head>
<body>
<main class="wrap">
  <h1>Visits</h1>

  <section class="card" id="login">
    <p class="muted">Enter your admin key. It is kept in this page's memory only and is never stored.</p>
    <div class="row">
      <input id="key" type="password" placeholder="Admin key" autocomplete="off">
      <button id="load">Show stats</button>
    </div>
    <p class="err" id="err"></p>
  </section>

  <section class="card" id="panel" hidden>
    <p class="muted">Total visits (all time)</p>
    <p class="big" id="total">0</p>
    <p class="muted">Last 14 days (UTC)</p>
    <div class="bars" id="bars"></div>
    <div class="labels" id="labels"></div>
    <div class="row" style="margin-top:14px">
      <button id="refresh">Refresh</button>
      <button class="ghost" id="lock">Lock</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let key = '';

async function load() {
  $('err').textContent = '';
  const k = key || $('key').value.trim();
  if (!k) { $('err').textContent = 'Enter the admin key.'; return; }
  try {
    const r = await fetch('/api/stats', { headers: { 'x-admin-key': k } });
    if (r.status === 401) { key = ''; $('err').textContent = 'Wrong key.'; return; }
    if (!r.ok) throw new Error('bad status');
    key = k;
    render(await r.json());
    $('login').hidden = true;
    $('panel').hidden = false;
  } catch (e) {
    $('err').textContent = 'Could not load stats. Check the environment variables and redeploy.';
  }
}

function render(d) {
  $('total').textContent = d.total.toLocaleString();
  const max = Math.max(1, ...d.days.map(x => x.visits));
  $('bars').innerHTML = '';
  $('labels').innerHTML = '';
  for (const x of d.days) {
    const b = document.createElement('div');
    b.className = 'bar';
    b.style.height = (x.visits / max * 100) + '%';
    b.title = x.date + ': ' + x.visits;
    $('bars').appendChild(b);
    const l = document.createElement('span');
    l.textContent = x.date.slice(8);
    $('labels').appendChild(l);
  }
}

function lock() {
  key = '';
  $('key').value = '';
  $('panel').hidden = true;
  $('login').hidden = false;
}

$('load').onclick = load;
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
$('refresh').onclick = load;
$('lock').onclick = lock;
</script>
</body>
</html>
